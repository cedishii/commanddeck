[package]
name = "commanddeck"
version = "0.5.0"
description = "A Windows desktop controller for CMD and PowerShell."
authors = ["Cedrick Kaneko"]
license = "MIT"
repository = "https://github.com/cedishii/commanddeck"
edition = "2024"
rust-version = "1.90"

[lib]
name = "commanddeck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
# Used only from Rust to open catalog documentation links; no webview permission is granted.
tauri-plugin-opener = "2.7"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2.0"
base64 = "0.23"
# Native Windows integration (ConPTY terminals, Job Objects). Unsafe use is confined to src/pty/conpty.rs.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Optional app password (D9): Argon2id, raw API only.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
# OS randomness for password salts and single-use grants.
getrandom = "0.3.4"

[dev-dependencies]
tempfile = "3.27"
