[package]
name = "commanddeck"
version = "0.1.0"
description = "A Windows desktop controller for CMD and PowerShell."
authors = ["Cedrick Kaneko"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "commanddeck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
